[package]
name = "terraforge"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = "0.18"
bevy_panorbit_camera = "0.34"
noise = "0.9"

# Bevy is far too slow in a fully-unoptimized debug build.
# Optimize our code lightly and dependencies fully, while keeping fast incremental rebuilds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
