[package]
name = "terraforge"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = { version = "0.18", features = ["jpeg"] }
bevy_egui = "0.39.1"
bevy_panorbit_camera = { version = "0.34", features = ["bevy_egui"] }
bytemuck = { version = "1", features = ["derive"] }
exr = "1.74.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
noise = "0.9"
pollster = "0.4"
rfd = "0.17.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
wgpu = "27"

# Bevy is far too slow in a fully-unoptimized debug build.
# Optimize our code lightly and dependencies fully, while keeping fast incremental rebuilds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
